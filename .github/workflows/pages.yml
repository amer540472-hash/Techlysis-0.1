# Techlysis — deploy to GitHub Pages.
#
# On every push to `main`, this workflow:
#   1. injects GitHub Secrets into js/env.runtime.js
#   2. uploads the static site as a Pages artifact
#   3. deploys it to GitHub Pages
#
# Secrets required (repo Settings → Secrets and variables → Actions):
#   TWELVE_DATA_API_KEY
#   SUPABASE_URL
#   SUPABASE_ANON_KEY
#
# SECURITY: only the Supabase ANON key may be injected here. Never use
# SUPABASE_SERVICE_ROLE_KEY in the frontend, Pages, or any committed file.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets into env.runtime.js
        run: |
          cat > js/env.runtime.js <<'EOF'
          // GENERATED BY .github/workflows/pages.yml — do not edit by hand.
          // Values come from GitHub Actions secrets (JSON-escaped via toJSON).
          window.__TECHLYSIS_ENV = {
            TWELVE_DATA_API_KEY: ${{ toJSON(secrets.TWELVE_DATA_API_KEY) }},
            SUPABASE_URL: ${{ toJSON(secrets.SUPABASE_URL) }},
            SUPABASE_ANON_KEY: ${{ toJSON(secrets.SUPABASE_ANON_KEY) }}
          };
          EOF

      - name: Prune non-site files from the artifact
        run: |
          rm -rf .git .github

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
